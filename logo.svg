<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Base Person Template (6-fold rotational symmetry around 250, 250) -->
    <g id="person-template">
      <!-- 100% Complete, perfectly round circular head with generous margin - NEVER CUT! -->
      <circle cx="250" cy="68" r="27" />
      <!-- Dynamic curved body and embracing arms -->
      <path d="M 216,116 
               C 226,104 240,98 250,98 
               C 260,98 274,104 284,116 
               C 312,142 338,178 350,218 
               C 353,228 348,234 338,232 
               C 324,228 312,210 298,188 
               C 285,168 268,150 250,144 
               C 232,138 214,142 196,154 
               C 188,159 180,154 182,146 
               C 188,132 202,122 216,116 Z" />
    </g>
  </defs>

  <!-- Clean circular badge base (white background with ample margin) -->
  <circle cx="250" cy="250" r="242" fill="#ffffff" />

  <!-- 
    The 6 people in the circle, perfectly rotated by 60 degrees.
    Every single head circle is 100% INTACT, fully round and never cut!
  -->
  <g id="people-ring">
    <!-- 1. RED (Top, 0 deg) -->
    <g fill="#E52424" transform="rotate(0 250 250)">
      <use href="#person-template" />
    </g>
    <!-- 2. GREEN (Top-Right, 60 deg) -->
    <g fill="#05A843" transform="rotate(60 250 250)">
      <use href="#person-template" />
    </g>
    <!-- 3. CYAN / BLUE (Bottom-Right, 120 deg) -->
    <g fill="#009FE3" transform="rotate(120 250 250)">
      <use href="#person-template" />
    </g>
    <!-- 4. PURPLE / MAGENTA (Bottom, 180 deg) -->
    <g fill="#8E1A8A" transform="rotate(180 250 250)">
      <use href="#person-template" />
    </g>
    <!-- 5. YELLOW (Bottom-Left, 240 deg) -->
    <g fill="#F4B400" transform="rotate(240 250 250)">
      <use href="#person-template" />
    </g>
    <!-- 6. ORANGE (Top-Left, 300 deg) -->
    <g fill="#F37023" transform="rotate(300 250 250)">
      <use href="#person-template" />
    </g>

    <!-- Seamless cyclic overlap: Red left shoulder over Orange right arm -->
    <g fill="#E52424" transform="rotate(0 250 250)">
      <circle cx="250" cy="68" r="27" />
      <path d="M 216,116 C 226,104 240,98 250,98 L 250,144 C 232,138 214,142 196,154 C 188,159 180,154 182,146 C 188,132 202,122 216,116 Z" />
    </g>
  </g>

  <!-- Center Typography: Connections English School -->
  <!-- Bold italic classic serif matching original logo branding -->
  <g text-anchor="middle" font-family="'Georgia', 'Times New Roman', 'Palatino', serif" font-weight="bold" font-style="italic" fill="#0f172a">
    <text x="250" y="206" font-size="34" letter-spacing="-0.5">Connections</text>
    <text x="250" y="258" font-size="33" letter-spacing="-0.5">English</text>
    <text x="250" y="308" font-size="33" letter-spacing="-0.5">School</text>
  </g>
</svg>
